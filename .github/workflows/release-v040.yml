name: Publish Kora 0.4.0 preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v040.yml]

permissions:
  contents: write

concurrency:
  group: kora-release-v040
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'omsc1213/kora-download-manager' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the release already exists
        id: guard
        shell: pwsh
        run: |
          $existing = gh release view v0.4.0 --json isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if ($release.isDraft) { throw 'A draft v0.4.0 already exists. Review that draft before retrying.' }
            Write-Output "Already published: $($release.url)"
            'publish=false' >> $env:GITHUB_OUTPUT
          } else {
            'publish=true' >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Run Python and browser regression checks
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-work | Out-Null
          Push-Location tests
          python -m unittest test_product_features test_save_defaults test_video.PolicyTests test_v02.EvidenceTests test_bridge -v
          $testExit = $LASTEXITCODE
          Pop-Location
          if ($testExit -ne 0) { throw 'Python checks failed.' }
          node tests/test_browser_policy.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser policy check failed.' }
          node tests/test_browser_capture.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser capture check failed.' }
      - name: Test and build the Rust launcher
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          cargo test --offline
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          cargo build --release --offline
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed.' }
          & ./target/release/kora.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Launcher startup failed.' }
      - name: Package original code and generate SHA-256 checksums
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'kora-release-output'
          $stage = Join-Path $env:RUNNER_TEMP 'kora-release-stage/Kora'
          New-Item -ItemType Directory -Force $out,$stage | Out-Null
          $allowed = @('.py','.cmd','.ps1')
          foreach ($entry in (Get-ChildItem -File)) {
            if ($entry.Extension -in $allowed -or $entry.Name -in @('README.md','LICENSE','THIRD_PARTY.md','VALIDATION.md','RELEASE_NOTES.md','SECURITY.md')) {
              Copy-Item -LiteralPath $entry.FullName -Destination $stage
            }
          }
          Copy-Item -LiteralPath browser -Destination $stage -Recurse
          Copy-Item -LiteralPath target/release/kora.exe -Destination (Join-Path $stage 'kora.exe')
          $windows = Join-Path $out 'Kora-v0.4.0-Windows-Online.zip'
          Compress-Archive -LiteralPath $stage -DestinationPath $windows
          $source = Join-Path $out 'Kora-v0.4.0-Source.zip'
          git archive --format=zip --prefix=kora-download-manager/ -o $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($path in @($windows,$source)) {
            $archive = [IO.Compression.ZipFile]::OpenRead($path)
            try {
              foreach ($entry in $archive.Entries) {
                if ($entry.FullName -match '(^|/)(data|evidence|runtime|vendor|test-work|target)/') { throw "Unexpected development/dependency directory: $($entry.FullName)" }
                if ($entry.FullName -match '\.(exe|dll)$' -and $entry.FullName -ne 'Kora/kora.exe') { throw "Unexpected binary: $($entry.FullName)" }
                $stream = $entry.Open()
                try { $stream.CopyTo([IO.Stream]::Null) } finally { $stream.Dispose() }
              }
            } finally { $archive.Dispose() }
          }
          $lines = foreach ($path in @($source,$windows)) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          [IO.File]::WriteAllLines((Join-Path $out 'SHA256SUMS.txt'),$lines,(New-Object Text.UTF8Encoding($false)))
          "KORA_RELEASE_OUTPUT=$out" >> $env:GITHUB_ENV
      - name: Create draft, upload assets, then publish preview
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          gh release create v0.4.0 --target $env:GITHUB_SHA --title 'Kora 0.4.0 Preview' --notes-file RELEASE_NOTES.md --prerelease --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          $source = Join-Path $env:KORA_RELEASE_OUTPUT 'Kora-v0.4.0-Source.zip'
          $windows = Join-Path $env:KORA_RELEASE_OUTPUT 'Kora-v0.4.0-Windows-Online.zip'
          $checksums = Join-Path $env:KORA_RELEASE_OUTPUT 'SHA256SUMS.txt'
          gh release upload v0.4.0 $source $windows $checksums
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          $draft = gh release view v0.4.0 --json assets | ConvertFrom-Json
          foreach ($path in @($source,$windows,$checksums)) {
            $asset = $draft.assets | Where-Object name -eq ([IO.Path]::GetFileName($path))
            if (-not $asset -or $asset.size -ne (Get-Item -LiteralPath $path).Length) { throw 'Asset verification failed; release remains a draft.' }
          }
          gh release edit v0.4.0 --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the preview.' }
          gh release view v0.4.0 --json url,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }

